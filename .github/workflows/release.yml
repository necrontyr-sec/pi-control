name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release

      - name: Package
        run: |
          tar -czf pi-control-linux-x86_64.tar.gz \
            -C target/release reboot

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: pi-control-linux-x86_64.tar.gz